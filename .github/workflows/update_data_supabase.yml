name: Export Supabase CSV

on:
  workflow_dispatch:

  schedule:
    # Tous les mercredis à 22:00 UTC
    - cron: "0 22 * * 3"

jobs:
  export-data-supabase:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git LFS
        run: |
          git lfs install
          git lfs track "data/fotmob_v2.csv"
          git lfs track "data/sofascore_v2.csv"
          git add .gitattributes

      - name: Export Supabase tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python script/export_data_supabase.py

      - name: Commit and push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes
          git add data/*.csv

          if git diff --cached --quiet; then
            echo "Aucune modification détectée."
          else
            git commit -m "Update Supabase CSV exports"
            git push
          fi